name: iyoot
description: "哎呦，真疼"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:

  # 图标
  cupertino_icons: ^1.0.2
  remixicon: ^1.2.0 #Remix图标

  # 框架、工具
  get: ^4.6.6 #状态管理、路由管理、国际化
  dio: ^5.4.3+1 #网络请求
  hive: 2.2.3 #持久化存储
  hive_flutter: 1.1.0 #持久化存储
  logger: ^2.0.2 #日志
  intl: ^0.20.0 #国际化
  qr_flutter: ^4.1.0 #二维码生成
  dynamic_color: ^1.8.1 #动态颜色
  path: any
  udp: ^5.0.3 #UDP
  uuid: ^4.3.3 #UUID
  webdav_client: ^1.2.2 # WebDAV
  archive: ^4.0.7 #文件压缩
  crypto: ^3.0.6

  #Widget
  flutter_staggered_grid_view: ^0.7.0 #瀑布流/GridView
  flutter_easyrefresh: 2.2.2 #下拉刷新、上拉加载
  extended_image: ^10.0.1 #拓展Image,支持缓存
  flutter_smart_dialog: ^4.9.2 #各种弹窗 Toast/Dialog/Popup
  sticky_headers: ^0.3.0+2 #吸顶
  lottie: ^3.3.2 #lottie动画
  flex_seed_scheme: ^4.0.1
  # 防抖节流
  easy_debounce: ^2.0.3
  flutter_cache_manager: any

  rxdart: ^0.28.0

  #系统交互
  package_info_plus: ^9.0.0 #包信息
  device_info_plus: ^12.1.0 #设备信息
  url_launcher: ^6.3.1 #打开链接
  share_plus: ^12.0.0 #分享
  path_provider: ^2.1.5 #常用路径
  cross_file: ^0.3.4+2 #跨平台文件
  permission_handler: ^12.0.1 #权限处理
  image_gallery_saver_plus: ^4.0.1 #图片保存到相册
  screen_brightness: ^2.1.2 #亮度控制
  auto_orientation_v2: ^2.3.6 #屏幕方向
  wakelock_plus: ^1.2.11 #屏幕常亮
  file_picker: ^10.3.3 #文件选择
  window_manager: ^0.5.1 #窗口管理
  floating: ^6.0.0 #PIP画中画
  flutter_inappwebview: ^6.1.5 #WebView
  connectivity_plus: ^7.0.0 #网络状态
  mobile_scanner: ^7.1.2 #二维码扫描
  volume_controller: ^3.4.0 #音量控制
  flutter_js: ^0.8.5
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.21.0
  metadata_god: ^1.1.0
  go_router: ^14.2.0

  # 网络相关
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  network_info_plus: ^7.0.0
  signalr_netcore: ^1.3.9 #SignalR

  # 视频播放
  media_kit: ^1.2.1
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7

  encrypt: ^5.0.3
  shared_preferences: ^2.2.3
  shadcn_flutter: ^0.0.47
  sqlite3: ^2.4.3
  sqlite3_flutter_libs: ^0.5.23
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dependency_overrides:
  screen_brightness: ^2.1.2
  screen_brightness_android: 2.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.3.3
  drift_dev: ^2.21.0
  riverpod_generator: ^2.4.3
  auto_route_generator: ^9.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  macos:
    generate: true

flutter_native_splash:
  color: "#000000"               # 兜底背景色
  image: assets/images/splash.png       # 你的全屏图片

  # 关键设置
  android_gravity: fill                     # 图片填满屏幕（可能会有少量裁剪，但不会留白边）
  ios_content_mode: scaleAspectFill
  fullscreen: true               # 隐藏状态栏（启动时全屏）

  android_12:
    image: assets/images/splash.png     # Android 12+ 的特殊适配
    color: "#ffffff"

    # 如果你希望图片保持比例不被拉伸，可以使用 gravity: center，但 fill: true 更有沉浸感

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/statement.txt
    - assets/images/
    - assets/icons/
    - assets/lotties/
    - assets/scripts/

